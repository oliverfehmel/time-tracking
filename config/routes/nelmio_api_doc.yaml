# OpenAPI document and Swagger UI; both live under the main firewall and require a login.
app.swagger:
    path: /api/docs.json
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger }

app.swagger_ui:
    path: /api/docs
    methods: GET
    defaults: { _controller: nelmio_api_doc.controller.swagger_ui }
