name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      database:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app_test
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      # Doctrine appends "_test" in the test env (-> app_test, created by the service). serverVersion lets
      # doctrine:database:create work without connecting to a database that does not exist yet.
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/app?serverVersion=11.8.2-MariaDB&charset=utf8mb4"

    steps:
      - uses: actions/checkout@v7

      - name: PHP Setup
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        run: composer install

      - name: Prepare Test Database
        run: |
          php bin/console doctrine:database:create --if-not-exists --env=test
          php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Run Tests
        run: php bin/phpunit
