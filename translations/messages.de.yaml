  half_days:
    title: Halbe Tage
    enabled: Halbe Tage sind aktiviert
    disabled: Halbe Tage sind deaktiviert
    fraction: 'Anträge und Feiertage haben „halfDay“ und „dayFraction“ (1.0 oder 0.5); „days“ zählt die angerechneten Tage, z. B. 0.5.'
    requests: Ein halber Tag ist nur für eintägige Anträge möglich. Zwei halbe Tage dürfen sich einen Tag teilen, außer auf einem halben Feiertag.
    holidays: Neue halbe Tage (Anträge, Feiertage, 0,5er-Kontingente) gibt es nur, wenn das Feature aktiv ist – sonst antwortet die API mit 422 „half_days_disabled“.
    existing: Bestehende halbe Tage werden immer als halbe Tage ausgegeben und berechnet, auch wenn das Feature aus ist.
  errors:
    title: Fehler
    text: 'Fehler kommen als „application/problem+json“ mit einem maschinenlesbaren „code“ und – bei Eingabefehlern – den betroffenen Feldern.'
    status_400: Ungültiges JSON oder fehlerhafte Anfrage
    status_401: Token fehlt, ist unbekannt oder abgelaufen
    status_403: Keine Berechtigung, Nur-Lese-Token oder Bearbeitungssperre
    status_404: Unbekannt oder Daten eines anderen Benutzers
    status_409: Konflikt, z. B. Timer läuft schon oder Antrag ist nicht mehr offen
    status_415: Body ist kein JSON
    status_422: Ungültige Eingabe oder verletzte Fachregel (z. B. Kontingent, Überschneidung)
