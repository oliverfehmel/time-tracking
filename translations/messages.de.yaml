api_guide:
  nav: API-Anleitung
  title: REST-API
  subtitle: Benutzer, Zeiten, Abwesenheiten und Feiertage per HTTP lesen und ändern – mit den Rechten deines Kontos.
  swagger: Swagger UI
  openapi_json: OpenAPI (JSON)
  back_to_app: Zurück zur Zeiterfassung
  token:
    title: API-Token erstellen
    text: Unter Profil → API-Tokens erstellst du ein persönliches Token. Es wird genau einmal angezeigt; gespeichert wird nur ein Hash.
    scopes: '„Nur lesen“ erlaubt ausschließlich GET-Anfragen, „Lesen und schreiben“ alle Anfragen, die du auch in der App ausführen darfst.'
    expiry: Tokens laufen nach 30 Tagen, 90 Tagen, einem Jahr oder nie ab und lassen sich jederzeit widerrufen.
    secret: Behandle ein Token wie ein Passwort. Ein Passwortwechsel widerruft Tokens nicht – widerrufe sie bei Verdacht selbst. Während du als anderer Benutzer angemeldet bist, kannst du keine Tokens erstellen.
  auth:
    title: Authentifizierung
    text: 'Sende das Token bei jeder Anfrage im Header „Authorization: Bearer …“. Die API nutzt keine Sitzung – das Anmelde-Cookie der App gilt dort nicht.'
    base_url: 'Basis-URL: %url%'
  permissions:
    title: Berechtigungen
    user: Normale Benutzer sehen und ändern nur ihre eigenen Daten (Zeiten, Timer, Arbeitsorte, Abwesenheiten, Kontingente, zugewiesene Feiertage).
    admin: Admins sehen alle Daten, verwalten Benutzer, Feiertage, Abwesenheitsarten und Kontingente und genehmigen oder lehnen Anträge ab (nicht ihre eigenen).
    locks: 'Für normale Benutzer gelten dieselben Sperren wie in der App: Zeiten und Arbeitsorte nur im aktuellen und im Vormonat und nur, wenn das Bearbeiten erlaubt ist.'
    not_found: Daten anderer Benutzer werden mit 404 beantwortet, Admin-Funktionen mit 403.
  format:
    title: Formate
    envelope: 'Jede Antwort steckt in „data“; Listen haben zusätzlich „meta“ mit page, perPage und total.'
    dates: Datumswerte als YYYY-MM-DD, Zeitpunkte nach RFC 3339 mit Zeitzonen-Offset.
    numbers: Dauern in Sekunden, Tage als Dezimalzahl (0.5 = halber Tag).
    pagination: Listen mit ?page=1&perPage=50 (maximal 200).
    patch: PATCH ändert nur die gesendeten Felder.
    language: Fehlermeldungen kommen in der Sprache aus Accept-Language (de oder en).
  endpoints:
    title: Endpunkte
    area: Bereich
    paths: Pfade (unter /api/v1)
    who: Wer
    details: Alle Parameter, Felder und Antworten findest du in der Swagger UI.
    me:
      name: Ich
      paths: GET /me
      who: alle – eigenes Konto, Token und Feature-Schalter
    users:
      name: Benutzer
      paths: GET /users, GET|PATCH|DELETE /users/{id}, POST /users
      who: Lesen eigenes Konto; Verwalten nur Admins
    time_entries:
      name: Zeiteinträge
      paths: GET|POST /time-entries, GET|PATCH|DELETE /time-entries/{id}
      who: eigene; Admins alle
    timer:
      name: Timer
      paths: GET /timer, POST /timer/start, POST /timer/stop
      who: eigener Timer
    report:
      name: Auswertung
      paths: GET /users/{id}/time-report/{year}
      who: eigene; Admins alle
    work_locations:
      name: Arbeitsorte
      paths: GET /work-location-types, GET /users/{id}/work-locations, PUT|DELETE /users/{id}/work-locations/{date}
      who: eigene; Admins alle
    absence_types:
      name: Abwesenheitsarten
      paths: GET /absence-types, GET|PATCH /absence-types/{id}, POST /absence-types
      who: Lesen alle; Verwalten nur Admins
    absence_requests:
      name: Abwesenheiten
      paths: GET|POST /absence-requests, GET /absence-requests/{id}, POST …/{id}/cancel, …/approve, …/reject
      who: eigene; Admins alle und Genehmigung
    quotas:
      name: Kontingente
      paths: GET /users/{id}/absence-quotas, PUT|DELETE /users/{id}/absence-quotas/{year}/{typeId}
      who: Übersicht eigene; Setzen nur Admins
